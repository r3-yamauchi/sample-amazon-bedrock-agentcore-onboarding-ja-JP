AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Markdown を HTML に変換して SES で送信する AgentCore Gateway 用の Lambda 関数

Parameters:
  SenderEmail:
    Type: String
    Description: Amazon SES 用の検証済み送信元メールアドレス
    Default: ""

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.12

Resources:
  AgentCoreGatewayFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Description: Markdown を HTML に変換して SES で送信する Lambda 関数
      Environment:
        Variables:
          SES_SENDER_EMAIL: !Ref SenderEmail
          LOG_LEVEL: INFO
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            # Permission to send emails via SES
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: 
                - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
            # Permission to verify email addresses (optional, for development)
            - Effect: Allow
              Action:
                - ses:GetIdentityVerificationAttributes
                - ses:VerifyEmailIdentity
              Resource: '*'

Outputs:
  AgentCoreGatewayFunctionArn:
    Description: ARN of the Lambda function for AgentCore Gateway
    Value: !GetAtt AgentCoreGatewayFunction.Arn
  AgentCoreGatewayFunctionName:
    Description: Name of the Lambda function
    Value: !Ref AgentCoreGatewayFunction
